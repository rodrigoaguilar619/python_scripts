          - Construcción de componentes reutilizables en React para tablas, formularios dinámicos, manejo de sesión y autenticación, reduciendo tiempos de desarrollo frontend.
          - Mantenimiento y mejora de librerías internas de seguridad, incluyendo integración y validación de autenticación LDAP.
          - Desarrollo de soluciones modulares backend y frontend para gestión de usuarios, validación de CFDI y automatización de envíos masivos de correos electrónicos.
          - Implementación de interfaces React para consumo de servicios financieros en tiempo real, integrando APIs de forma segura.
          - Desarrollo de servicios web para comunicación con el Registro Único de Garantías Mobiliarias (RUG), automatizando el intercambio de información con dependencias gubernamentales.

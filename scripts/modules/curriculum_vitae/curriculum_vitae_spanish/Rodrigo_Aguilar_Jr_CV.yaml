    experiencia:
      - company: Banco Invex
        position: Desarrollador Java / DB Oracle
        start_date: 2026-01
        end_date: present
        location: CDMX
        highlights:
          - Desarrollo y mantenimiento de microservicios backend para la gestión de productos de inversión (pagarés y CEDES cuponados).
          - Implementación de lógica de negocio para validación de cuentas de clientes, realizando conexiones con APIs internas para consulta de cuentas.
          - Generación de reportes en PDF para operaciones financieras.
          - Diseño y desarrollo de servicios REST utilizando Spring Boot bajo arquitectura de microservicios.
          - Integración y gestión de bases de datos Oracle, incluyendo consultas y manejo de transacciones. 
          - Despliegue y administración de microservicios en entornos OpenShift.
          - Implementación y mantenimiento de pipelines de CI/CD utilizando Bitbucket, Harness y WSO2.
          - Colaboración en equipos ágiles bajo metodología Scrum, utilizando Jira para la gestión de tareas, incidencias y seguimiento de proyectos.
        tools: Java, DB Oracle, REST, JasperReports, OpenShift, Harness, Bitbucket, WSO2

      - company: DGCM SA de CV (DEVANT) - Banco Bx+
        position: Desarrollador Java / SQL Server
        start_date: 2021-02
        end_date: 2025-12
        location: CDMX
        highlights:
          - Diseño e implementación de APIs REST y SOAP para la integración segura de sistemas internos del banco Bx+.
          - Desarrollo de servicios RESTful para operaciones CRUD sobre bases de datos con información de clientes personal y financiera, garantizando integridad transaccional y cumplimiento de normativas bancarias.
          - Implementación de módulos web para carga y descarga de documentos (contratos, identificaciones y comprobantes), con validaciones de tipo, tamaño y flujos de aprobación multiusuario.
          - Automatización y generación de reportes financieros y administrativos en formatos Excel y PDF mediante JasperReports, facilitando el análisis de la cartera de créditos.
          - Diseño, desarrollo y mantenimiento de aplicaciones backend basadas en arquitectura de microservicios, utilizando Spring Boot, para garantizar la independencia entre las distintas aplicaciones y un mejor despliegue sin afectar todo el ecosistema.
          - Migración y modernización de aplicaciones empresariales de Java 8 a Java 11 y Java 17, asegurando compatibilidad, mejoras de rendimiento y adopción de nuevas características del lenguaje.
          - Implementación de una arquitectura en capas (Layered Architecture) basada en Spring Boot, estructurada en Controllers, Services, Repositories, Entities y Configuración, facilitando la mantenibilidad y escalabilidad de las aplicaciones.
          - Gestión de despliegues de aplicaciones backend mediante la carga de archivos JAR vía FTP a servidores, con configuración para la ejecución automática en instancias específicas.
          - Desarrollo, administración y normalización de bases de datos en SQL Server para almacenar informacion de los clientes del banco, administración de documentos e información referente a créditos bancarios.
          - Creación y optimización de Stored Procedures con consultas complejas sobre múltiples tablas relacionadas, orientadas al manejo de grandes volúmenes de datos.
          - Implementación de estándares de seguridad utilizando Spring Security y JWT (JSON Web Tokens) para autenticación, con validación de credenciales contra un repositorio LDAP institucional, establecimiento de conexiones seguras HTTPS/TLS, validaciones de datos de entrada y cifrado de información sensible.
        tools: Java, SQL Server, REST, SOAP, JasperReports, LDAP


    proyectos:
      - name: '[Finanzas Bolsa de Valores](https://portfolio-rodrigo-aguilar.netlify.app/projects/finanzas_bolsa_valores/main/)'
        start_date: 2022-01
        end_date: present
        location: CDMX
        summary: Aplicación web integral para el registro y control local de compras y ventas de emisoras de bolsa de valores, con visualización gráfica de datos y autenticación segura.
        highlights:
         - Backend desarrollado en Java con Spring Boot y arquitectura REST para exponer endpoints robustos de gestión financiera (servicios y lógica de negocio).
         - Frontend utilizando React con Redux para visualización de precios, portafolio y alertas en tiempo real.
         - Integración de seguridad mediante JSON Web Tokens (JWT) para protección de rutas y autenticación de usuarios.
         - Implementación de módulos de rastreo de transacciones y actualización histórica de precios por fecha de emisoras usando WebFlux.
         - Uso de Swagger para documentación interactiva de APIs y SonarQube para aseguramiento de calidad de código.

      - name: '[Gestor de Dietas y Alimentos](https://portfolio-rodrigo-aguilar.netlify.app/projects/diet_control/main/)'
        date:
        start_date: 2023-01
        end_date: present
        location: CDMX
        summary: Plataforma para registro y gestión de dietas, cálculo automático de nutrientes y generación de reportes nutricionales basada en los alimentos y porciones ingresadas.
        highlights:
         - Backend en Java con Spring Boot que expone endpoints REST estructurados para manejo de alimentos, dietas y cálculos de nutrientes.
         - Frontend en Angular con Redux para una experiencia de usuario fluida en la gestión de dietas, edición de alimentos y visualización de nutrientes.
         - Cálculo en tiempo real de totales de macros y micronutrientes basado en datos ingresados por usuario, con paneles de resumen interactivos.
         - Generación de reportes en PDF para seguimiento detallado de dietas y consumo nutricional.
         - Integración de Swagger para documentación de APIs y SonarQube para calidad de código y análisis estático.

